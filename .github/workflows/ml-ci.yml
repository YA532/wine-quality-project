
name: Wine Quality ML CI and CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train Wine Quality model
        run: python train_model.py

      - name: Check ML Quality Gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t wine-quality-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name wine-quality-ml-container \
            -p 5000:5000 \
            wine-quality-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs wine-quality-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "fixed acidity": 7.4,
              "volatile acidity": 0.70,
              "citric acid": 0.00,
              "residual sugar": 1.9,
              "chlorides": 0.076,
              "free sulfur dioxide": 11,
              "total sulfur dioxide": 34,
              "density": 0.9978,
              "pH": 3.51,
              "sulphates": 0.56,
              "alcohol": 9.4
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'
          echo "Prediction API test passed."

      - name: Show Docker container logs
        if: always()
        run: docker logs wine-quality-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f wine-quality-ml-container || true

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wine-quality-ml-artifacts
          path: |
            wine_quality_model.pkl
            metrics.json
            datasets/WineQT.csv
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp wine_quality_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          echo "Wine Quality Prediction Application" > release_candidate/DEPLOYMENT.txt
          echo "Run the application using: python app.py" >> release_candidate/DEPLOYMENT.txt
          echo "Prediction endpoint: POST /predict" >> release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: wine-quality-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
