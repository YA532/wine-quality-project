name: Wine Quality ML CI and CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train Wine Quality model
        run: python train_model.py

      - name: Check ML Quality Gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wine-quality-ml-artifacts
          path: |
            wine_quality_model.pkl
            metrics.json
            datasets/WineQT.csv
          if-no-files-found: error
          retention-days: 7

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp wine_quality_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          echo "Wine Quality Prediction Application" > release_candidate/DEPLOYMENT.txt
          echo "Run the application using: python app.py" >> release_candidate/DEPLOYMENT.txt
          echo "Prediction endpoint: POST /predict" >> release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: wine-quality-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
