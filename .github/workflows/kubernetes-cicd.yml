name: Wine Quality - Kubernetes CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wine-quality-ml

jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create image name
        id: image
        run: |
          IMAGE_ID="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          IMAGE_REF="$IMAGE_ID:sha-${GITHUB_SHA}"
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:ci" .

      - name: Start test container
        run: |
          docker run -d \
            --name wine-quality-ci \
            -p 5000:5000 \
            "$IMAGE_NAME:ci"

      - name: Test API health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done

          echo "Health check failed."
          docker logs wine-quality-ci
          exit 1

      - name: Run Python unit tests
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "$IMAGE_NAME:ci" python -m unittest discover -v

      - name: Test prediction endpoint
        run: |
          curl --fail --silent \
            -X POST http://127.0.0.1:5000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "fixed acidity": 7.4,
              "volatile acidity": 0.70,
              "citric acid": 0.00,
              "residual sugar": 1.9,
              "chlorides": 0.076,
              "free sulfur dioxide": 11,
              "total sulfur dioxide": 34,
              "density": 0.9978,
              "pH": 3.51,
              "sulphates": 0.56,
              "alcohol": 9.4
            }'
          echo "Prediction test passed."

      - name: Remove test container
        if: always()
        run: docker rm -f wine-quality-ci || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag tested image
        run: |
          docker tag "$IMAGE_NAME:ci" "$IMAGE_ID:latest"
          docker tag "$IMAGE_NAME:ci" "${{ steps.image.outputs.image_ref }}"

      - name: Push Docker images to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "${{ steps.image.outputs.image_ref }}"

  deploy-kubernetes:
    name: Deploy to Minikube
    needs: build-test-push
    runs-on: self-hosted

    steps:
      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get deployment wine-quality
          kubectl get secret ghcr-secret

      - name: Show current deployment image
        run: |
          kubectl get deployment wine-quality \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="wine-quality-api")].image}'
          echo

      - name: Deploy new Wine Quality image
        run: |
          kubectl set image deployment/wine-quality \
            wine-quality-api=${{ needs.build-test-push.outputs.image_ref }}

      - name: Wait for Kubernetes rollout
        run: |
          kubectl rollout status deployment/wine-quality --timeout=180s

      - name: Verify deployed API health
        run: |
          kubectl exec deployment/wine-quality -- \
            python -c "import urllib.request; print(urllib.request.urlopen('http://wine-quality-service/health', timeout=10).read().decode())"

      - name: Roll back deployment if deployment fails
        if: failure()
        run: |
          echo "Deployment failed. Rolling back to the previous version..."
          kubectl rollout undo deployment/wine-quality
          kubectl rollout status deployment/wine-quality --timeout=180s

      - name: Display final deployment status
        if: success()
        run: |
          echo "Deployment successful."
          kubectl get deployment wine-quality
          kubectl get pods
          kubectl get service wine-quality-service
